[project]
name = "graph-memory"
version = "1.0.0"
description = "Graph memory for LLM agents: facts and stated dependencies extracted once, worked out by code at read time"
readme = "README.md"
authors = [{ name = "Kaijun Hao" }]
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["graph_memory*", "graph_benchmarks*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
